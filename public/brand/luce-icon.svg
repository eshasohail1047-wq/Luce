<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="LUCE">
  <title>LUCE</title>
  <!-- Icon: letter U + purple lens orb from the LUCE wordmark -->
  <defs>
    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="45%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#9B7CFF"/>
    </linearGradient>
    <radialGradient id="rays" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6D4DFF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#A78BFA" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="orbGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="58" r="36" fill="url(#rays)"/>

  <!-- U shape -->
  <path
    d="M34 28v36c0 16.5 13.4 30 30 30s30-13.5 30-30V28"
    stroke="#14121C"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <circle cx="64" cy="72" r="16" fill="url(#orbGrad)" filter="url(#orbGlow)"/>
  <circle cx="58" cy="66" r="5" fill="#fff" fill-opacity="0.55"/>
</svg>
