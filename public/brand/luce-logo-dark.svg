<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none" role="img" aria-label="LUCE">
  <title>LUCE</title>
  <rect width="420" height="120" fill="#0B0B10"/>
  <g font-family="Outfit, system-ui, sans-serif" font-weight="500" font-size="72" letter-spacing="0.14em" fill="#F5F4F8">
    <text x="28" y="78">L</text>
    <text x="98" y="78">U</text>
    <text x="188" y="78">C</text>
  </g>

  <radialGradient id="rays" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6D4DFF" stop-opacity="0.35"/>
    <stop offset="45%" stop-color="#A78BFA" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <circle cx="132" cy="62" r="28" fill="url(#rays)"/>

  <defs>
    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="45%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#9B7CFF"/>
    </linearGradient>
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="eBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F4F8"/>
      <stop offset="55%" stop-color="#6D4DFF"/>
      <stop offset="100%" stop-color="#9B7CFF"/>
    </linearGradient>
  </defs>

  <circle cx="132" cy="68" r="13" fill="url(#orbGrad)" filter="url(#orbGlow)"/>
  <circle cx="127" cy="63" r="4" fill="#fff" fill-opacity="0.55"/>

  <g transform="translate(278 32)">
    <rect width="58" height="11" rx="2" fill="#F5F4F8"/>
    <rect y="24" width="58" height="11" rx="2" fill="url(#eBeam)"/>
    <rect y="48" width="58" height="11" rx="2" fill="#F5F4F8"/>
  </g>
</svg>
